<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Serve this file via: `python3 -m http.server 8000` -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gator Review</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            padding: 20px;
        }

        #sidebar h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }

        #sidebar ul {
            list-style: none;
        }

        #sidebar li {
            margin-bottom: 8px;
        }

        #sidebar a {
            display: block;
            padding: 10px 12px;
            text-decoration: none;
            color: #333;
            border-radius: 4px;
            transition: background 0.2s;
        }

        #sidebar a:hover {
            background: #e0e0e0;
        }

        #sidebar a.active {
            background: #007acc;
            color: white;
        }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 40px 60px;
        }

        #markdown-content {
            max-width: 900px;
            margin: 0 auto;
        }

        #markdown-content h1 {
            font-size: 32px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        #markdown-content h2 {
            font-size: 24px;
            margin-top: 32px;
            margin-bottom: 16px;
        }

        #markdown-content h3 {
            font-size: 20px;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        #markdown-content p {
            line-height: 1.6;
            margin-bottom: 16px;
        }

        #markdown-content ul, #markdown-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        #markdown-content li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        #markdown-content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        #markdown-content pre {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 4px;
            overflow-x: auto;
            margin-bottom: 16px;
        }

        #markdown-content pre code {
            background: none;
            padding: 0;
        }

        #markdown-content blockquote {
            border-left: 4px solid #ddd;
            padding-left: 16px;
            margin: 16px 0;
            color: #666;
        }

        #markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 16px;
        }

        #markdown-content th, #markdown-content td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }

        #markdown-content th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>Gator Review</h1>
        <ul id="nav-list"></ul>
    </div>
    <div id="content">
        <div id="markdown-content"></div>
    </div>

    <script>
        const files = [
            { file: '00-summary.md', title: 'Summary' },
            { file: '01-critical-fixes.md', title: 'Critical Fixes' },
            { file: '02-bugs-and-issues.md', title: 'Bugs and Issues' },
            { file: '03-incomplete-implementations.md', title: 'Incomplete Implementations' },
            { file: '04-new-features.md', title: 'New Features' },
            { file: '05-refactoring-opportunities.md', title: 'Refactoring Opportunities' },
            { file: '06-testing-improvements.md', title: 'Testing Improvements' },
            { file: '07-documentation-gaps.md', title: 'Documentation Gaps' },
            { file: '08-maintenance-and-cleanup.md', title: 'Maintenance and Cleanup' },
            { file: '09-configuration-and-deployment.md', title: 'Configuration and Deployment' }
        ];

        const navList = document.getElementById('nav-list');
        const markdownContent = document.getElementById('markdown-content');

        // Create navigation
        files.forEach((item, index) => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = '#' + item.file;
            a.textContent = item.title;
            a.dataset.file = item.file;
            li.appendChild(a);
            navList.appendChild(li);
        });

        // Load and render markdown file
        async function loadMarkdown(filename) {
            markdownContent.innerHTML = '<p class="loading">Loading...</p>';

            try {
                const response = await fetch(filename);
                if (!response.ok) {
                    throw new Error(`Failed to load ${filename}`);
                }
                const markdown = await response.text();
                const html = marked.parse(markdown);
                markdownContent.innerHTML = html;

                // Update active nav item
                document.querySelectorAll('#sidebar a').forEach(a => {
                    a.classList.remove('active');
                    if (a.dataset.file === filename) {
                        a.classList.add('active');
                    }
                });
            } catch (error) {
                markdownContent.innerHTML = `<p style="color: red;">Error loading ${filename}: ${error.message}</p>`;
            }
        }

        // Handle navigation clicks
        navList.addEventListener('click', (e) => {
            if (e.target.tagName === 'A') {
                e.preventDefault();
                const filename = e.target.dataset.file;
                window.location.hash = filename;
                loadMarkdown(filename);
            }
        });

        // Handle hash changes
        window.addEventListener('hashchange', () => {
            const filename = window.location.hash.substring(1);
            if (filename) {
                loadMarkdown(filename);
            }
        });

        // Load initial file
        const initialFile = window.location.hash.substring(1) || files[0].file;
        loadMarkdown(initialFile);
    </script>
</body>
</html>
